# Cloudflare Workers + OpenNext for www.kamaunegasi.net
#
# Local: npm run preview
# Deploy: npm run deploy
# Cloudflare dashboard:
#   Build command:  npm run build   (→ opennextjs-cloudflare build → .open-next/)
#   Deploy command: npx wrangler deploy
# Inner Next build is set via open-next.config.ts buildCommand (avoids recursion).

name = "kamaunegasi-net"
main = ".open-next/worker.js"
compatibility_date = "2025-10-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
workers_dev = true

# Custom domains — without these, the zone can resolve on Cloudflare while
# www/apex serve the Workers empty placeholder ("There is nothing here yet").
routes = [
  { pattern = "www.kamaunegasi.net", custom_domain = true },
  { pattern = "kamaunegasi.net", custom_domain = true },
]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "kamaunegasi-net"

[vars]
SITE_DOMAIN = "www.kamaunegasi.net"
EXACT_NAME_POLICY = "1"
AGE_GATE_REQUIRED = "1"
ACCOUNT_GATE = "1"

# Durable auth/commerce store (kamaunegasi-auth KV namespace).
# preview_id required for Workers Preview Builds on PR branches.
# Same namespace as production is intentional for this house deploy
# (isolated preview KV: `npx wrangler kv namespace create AUTH_KV --preview`).
[[kv_namespaces]]
binding = "AUTH_KV"
id = "de9274dc7ff04729958e7c83eaebe84f"
preview_id = "de9274dc7ff04729958e7c83eaebe84f"
